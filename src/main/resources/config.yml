# ============================================================
#  LimboAFK - 基于 LimboAPI 的 AFK
#  颜色码：支持 & 与 §，例如 &c 或 §c
#  占位符：%seconds%  %player%  %server%
# ============================================================

# 插件总开关
enabled: true

# 是否开启自动 AFK 检测（关闭后仅 /afk 手动触发倒计时）
auto-afk: true

# 无“代理层可观测动作”多少秒后送入 Limbo
# 注意：Velocity 只能观测聊天、指令、切换服务器；后端服务器内的移动、转头、
# 交互不会产生代理事件，因此自动检测按“无聊天/无指令/未切服”计时。
# 若必须精确检测大厅内移动，需要后端插件或数据包拦截，本插件按需求不包含后端代码。
afk-timeout: 300

# 提前多少秒发送警告（0 = 不警告，直接送入 Limbo）
warning-before: 30

# 扫描周期（秒）
check-interval: 5

commands:
  # 是否启用 /afk
  afk-enabled: true
  # 是否启用 /limbo reload
  limbo-enabled: true

permissions:
  afk: limboafk.afk
  reload: limboafk.reload
  # 拥有此权限的玩家不会被自动送入 Limbo（手动 /afk 仍然有效）
  bypass: limboafk.bypass

messages:
  prefix: ""
  # 统一提示风格：成功 &a✔ 成功 &f描述。 / 警告 &e⚠ &l警告 &f描述。 / 失败 &c&l✕ &c失败 &f描述。
  afk-marked: "&e⚠ &l警告 &f已标记为 AFK，&c%seconds%&f 秒后进入 Limbo。"
  afk-cancelled: "&a✔ 成功 &f已取消 AFK 状态。"
  afk-warning: "&e⚠ &l警告 &f检测到你长时间未操作，&c%seconds%&f 秒后将进入 Limbo。"
  # 标题与提示对齐 Hypixel Limbo：You are AFK / Move around to return to the lobby
  limbo-title: "&c&lYou are AFK"
  limbo-subtitle: "&7移动鼠标或转头即可返回大厅"
  limbo-action-bar: "&e移动鼠标或转头即可返回大厅"
  limbo-chat: "&e⚠ &l警告 &f你因长时间未操作被传送至 Limbo。\n&e移动鼠标或转头即可返回大厅。"
  limbo-returned: "&a✔ 成功 &f已返回服务器 %server%，欢迎回来。"
  no-server: "&c&l✕ &c失败 &f原服务器不可用，且没有可用的后备服务器。"
  limbo-failed: "&c&l✕ &c失败 &f进入 Limbo 失败，请稍后再试。"
  reloaded: "&a✔ 成功 &f配置已重载。"
  reload-failed: "&c&l✕ &c失败 &f重载失败，请查看控制台。"
  no-permission: "&c&l✕ &c失败 &f你没有权限执行此操作。"
  command-disabled: "&c&l✕ &c失败 &f该指令已在配置中禁用。"
  players-only: "&c&l✕ &c失败 &f该指令只能由玩家执行。"
  usage: "&e⚠ &l警告 &f用法：/limbo reload"

limbo:
  # 虚拟维度：THE_END、NETHER、OVERWORLD
  dimension: THE_END
  spawn-x: 0.0
  spawn-y: 100.0
  spawn-z: 0.0
  yaw: 0.0
  pitch: 0.0
  # 进入 Limbo 时清空背包（槽位 0-45）
  empty-inventory: true
  # 关闭伤害：冒险模式，无法攻击/破坏方块，虚空内无伤害来源
  disable-damage: true
  # 关闭饥饿：旁观模式，客户端不显示生命/饥饿条（优先级高于 disable-damage）
  disable-hunger: true
  # 冻结坠落：让玩家悬浮在虚空，避免持续下落（建议保持 true）
  freeze-falling: false
